name: Build HiWiFi (MIPS Soft-Float) Version

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-mips-sf:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: mipsel
            suffix: hiwifi_mipsel_sf
            description: "HiWiFi MIPS32 (mipsel) - Soft-Float Static"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Download musl.cc soft-float MIPSel toolchain
        run: |
          TOOLCHAIN_URL="https://musl.cc/mipsel-linux-muslsf-cross.tgz"
          echo "Downloading $TOOLCHAIN_URL"
          wget -q "$TOOLCHAIN_URL" -O /tmp/mipsel-linux-muslsf-cross.tgz
          sudo mkdir -p /opt/cross
          sudo tar xzf /tmp/mipsel-linux-muslsf-cross.tgz -C /opt/cross
          ls -la /opt/cross/mipsel-linux-muslsf-cross/bin/

      - name: Add toolchain to PATH
        run: |
          echo "/opt/cross/mipsel-linux-muslsf-cross/bin" >> $GITHUB_PATH
          export PATH="/opt/cross/mipsel-linux-muslsf-cross/bin:$PATH"
          mipsel-linux-muslsf-gcc --version
          mipsel-linux-muslsf-g++ --version
          mipsel-linux-muslsf-strip --version

      - name: Create CMake cross-compilation toolchain file (Soft-Float)
        run: |
          printf '%s\n' \
            'SET(CMAKE_SYSTEM_NAME Linux)' \
            'SET(CMAKE_SYSTEM_PROCESSOR mipsel)' \
            '' \
            'SET(CMAKE_C_COMPILER   mipsel-linux-muslsf-gcc)' \
            'SET(CMAKE_CXX_COMPILER mipsel-linux-muslsf-g++)' \
            'SET(CMAKE_AR           mipsel-linux-muslsf-ar      CACHE FILEPATH "Archiver")' \
            'SET(CMAKE_RANLIB       mipsel-linux-muslsf-ranlib)' \
            'SET(CMAKE_STRIP        mipsel-linux-muslsf-strip)' \
            'SET(CMAKE_OBJCOPY      mipsel-linux-muslsf-objcopy)' \
            'SET(CMAKE_OBJDUMP      mipsel-linux-muslsf-objdump)' \
            'SET(CMAKE_NM           mipsel-linux-muslsf-nm)' \
            '' \
            '# 软浮点 + MIPS32 指令集（极路由 MT7620/MT7628）' \
            'SET(CMAKE_C_FLAGS   "-march=mips32r2 -msoft-float -static" CACHE STRING "" FORCE)' \
            'SET(CMAKE_CXX_FLAGS "-march=mips32r2 -msoft-float -static" CACHE STRING "" FORCE)' \
            '' \
            '# musl 工具链的 sysroot' \
            'SET(CMAKE_SYSROOT /opt/cross/mipsel-linux-muslsf-cross/mipsel-linux-muslsf)' \
            '' \
            'SET(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)' \
            'SET(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)' \
            'SET(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)' \
            'SET(CMAKE_FIND_ROOT_PATH_MODE_PACKAGE ONLY)' \
            > mipsel-sf-toolchain.cmake

      - name: Configure MariaDB for HiWiFi (Soft-Float Static)
        run: |
          mkdir -p bld_hiwifi
          cd bld_hiwifi

          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=../mipsel-sf-toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_CONFIG=mysql_release \
            -DCPACK_MONOLITHIC=ON \
            -DFEATURE_SET=small \
            -DWITH_SSL=bundled \
            -DWITH_ZLIB=bundled \
            -DWITH_PCRE=bundled \
            -DWITH_READLINE=bundled \
            -DWITH_JEMALLOC=OFF \
            -DWITH_EMBEDDED_SERVER=ON \
            -DWITH_EXTRA_CHARSETS=all \
            -DWITH_UNIT_TESTS=OFF \
            -DWITH_TESTS=OFF \
            -DWITH_SAFEMALLOC=OFF \
            -DWITH_DBUG_TRACE=OFF \
            -DWITH_ASAN=OFF \
            -DWITH_TSAN=OFF \
            -DWITH_UBSAN=OFF \
            -DWITH_NUMA=OFF \
            -DIGNORE_AIO_CHECK=YES \
            -DENABLED_PROFILING=OFF \
            -DSECURITY_HARDENED=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DWITHOUT_SERVER=OFF \
            -DCLIENT_PLUGIN_ZSTD=OFF \
            -DWITH_ROCKSDB_BZip2=OFF \
            -DWITH_ROCKSDB_LZ4=OFF \
            -DWITH_ROCKSDB_SNAPPY=OFF \
            -DWITH_ROCKSDB_ZSTD=OFF \
            -DWITH_PAM=OFF \
            -DHAVE_STACKTRACE=OFF \
            -DHAVE_BACKTRACE=OFF \
            -DWITH_SYSTEMD=OFF \
            -DWITH_LIBWRAP=OFF \
            -DCOMPILATION_COMMENT="HiWiFi MIPS32 Soft-Float (Built for MariaDB)"

      - name: Build MariaDB for HiWiFi
        run: |
          cd bld_hiwifi
          cmake --build . --verbose -- -j$(nproc)

      - name: Verify soft-float binaries
        run: |
          cd bld_hiwifi
          echo "=== Checking for hard-float opcodes (should be empty) ==="
          find . -type f -executable -exec mipsel-linux-muslsf-objdump -d {} \; 2>/dev/null | grep -E '\badd\.s\b|\bsub\.s\b|\bmul\.s\b|\bdiv\.s\b' || echo "No hard-float instructions found - GOOD"

          echo "=== File info ==="
          find . -type f -executable -exec file {} \; | grep -i mipsel || true

      - name: Strip MIPS binaries
        run: |
          cd bld_hiwifi
          for binary in \
            sql/mysqld \
            client/mariadb \
            client/mariadb-check \
            client/mariadb-dump \
            client/mariadb-import \
            client/mariadb-show \
            client/mariadb-slap \
            client/mariadb-upgrade
          do
            if [ -f "$binary" ]; then
              echo "Stripping $binary"
              mipsel-linux-muslsf-strip --strip-all "$binary"
            else
              echo "Warning: $binary not found, skipping"
            fi
          done
          echo "Strip complete"

      - name: Package HiWiFi build artifacts
        run: |
          mkdir -p hiwifi_release/bin
          mkdir -p hiwifi_release/lib
          mkdir -p hiwifi_release/share

          for binary in \
            sql/mysqld \
            client/mariadb \
            client/mariadb-check \
            client/mariadb-dump \
            client/mariadb-import \
            client/mariadb-show \
            client/mariadb-slap \
            client/mariadb-upgrade
          do
            src="bld_hiwifi/$binary"
            if [ -f "$src" ]; then
              cp "$src" hiwifi_release/bin/
            else
              echo "Warning: $src not found, skipping copy"
            fi
          done

          find hiwifi_release -type f -executable -exec file {} \; || true

          printf '%s\n' \
            'MariaDB for HiWiFi (MIPS32/mipsel Soft-Float)' \
            '=============================================' \
            '' \
            'Build Configuration:' \
            '  - Architecture: MIPS32 little-endian (mipsel)' \
            '  - Float ABI: Soft-Float (no FPU required)' \
            '  - Build Type: Release (Minimal Embedded)' \
            '  - C Library: musl (static linked)' \
            '  - SSL: Bundled OpenSSL' \
            '  - ZLIB: Bundled' \
            '  - PCRE: Bundled' \
            '  - Readline: Bundled' \
            '  - Embedded Server: Enabled' \
            '  - Shared Libraries: Disabled (static only)' \
            '  - PAM: Disabled' \
            '  - NUMA: Disabled' \
            '  - Profiling: Disabled' \
            '' \
            'Deployment Instructions for HiWiFi:' \
            '  1. Copy the entire hiwifi_release/ directory to your router' \
            '  2. Place binaries in /usr/bin/ or /opt/bin/' \
            '  3. All binaries are statically linked, no library dependencies' \
            '  4. Run as lightweight embedded database' \
            '' \
            'Note: This is a minimal embedded build. Not all storage engines' \
            '      and features are included. Built for MT7620/MT7628 (no FPU).' \
            > hiwifi_release/README.txt

          tar czf MariaDB_HiWiFi_MIPS32_SoftFloat.tar.gz hiwifi_release/

      - name: Upload HiWiFi build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MariaDB_HiWiFi_MIPS32_${{ matrix.suffix }}
          path: |
            MariaDB_HiWiFi_MIPS32_SoftFloat.tar.gz
            hiwifi_release/
          if-no-files-found: error

  release:
    needs: build-mips-sf
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download HiWiFi artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -la artifacts/

      - name: Create or Update HiWiFi Dev Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="dev-hiwifi"
          echo "Using fixed tag: $VERSION"

          gh release delete "$VERSION" --yes 2>/dev/null || true
          git push --delete origin "$VERSION" 2>/dev/null || true

          git tag -f "$VERSION"
          git push -f origin "$VERSION"

          NOTES=$'Automatic build from commit '"${{ github.sha }}"$'\n\n**Platform:**\n- HiWiFi MIPS32 (mipsel) Soft-Float\n- No FPU required (MT7620/MT7628 compatible)\n\n**Features:**\n- Minimal Embedded Server\n- musl libc static linking\n- Bundled SSL/Zlib/PCRE\n- Optimized for embedded devices'

          gh release create "$VERSION" \
            --title "MariaDB HiWiFi (MIPS32 Soft-Float) Development Build" \
            --notes "$NOTES" \
            --prerelease \
            artifacts/*