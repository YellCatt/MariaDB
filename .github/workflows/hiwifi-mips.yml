name: Build HiWiFi (MIPS Soft-Float) Version

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-mips-sf:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: mipsel
            suffix: hiwifi_mipsel_sf
            description: "HiWiFi MIPS32 (mipsel) - Soft-Float Static"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            bison \
            flex \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo-dev \
            ninja-build \
            xz-utils \
            perl \
            python3 \
            gawk

      - name: Download OpenWrt SDK (soft-float mipsel toolchain)
        run: |
          SDK_URL="https://downloads.openwrt.org/releases/22.03.5/targets/ramips/mt7620/openwrt-sdk-22.03.5-ramips-mt7620_gcc-11.2.0_musl.Linux-x86_64.tar.xz"
          echo "Downloading OpenWrt SDK..."
          curl -fsSL --retry 3 --retry-delay 2 "$SDK_URL" -o /tmp/openwrt-sdk.tar.xz
          sudo mkdir -p /opt/cross
          sudo tar xf /tmp/openwrt-sdk.tar.xz -C /opt/cross
          ls -la /opt/cross/openwrt-sdk-*/staging_dir/toolchain-*/bin/

      - name: Add toolchain to PATH
        run: |
          TOOLCHAIN_DIR=$(ls -d /opt/cross/openwrt-sdk-*/staging_dir/toolchain-*)
          TARGET_DIR=$(ls -d /opt/cross/openwrt-sdk-*/staging_dir/target-*)
          echo "$TOOLCHAIN_DIR/bin" >> $GITHUB_PATH
          echo "STAGING_DIR=$TOOLCHAIN_DIR" >> $GITHUB_ENV
          echo "TARGET_DIR=$TARGET_DIR" >> $GITHUB_ENV
          export PATH="$TOOLCHAIN_DIR/bin:$PATH"
          export STAGING_DIR="$TOOLCHAIN_DIR"
          mipsel-openwrt-linux-musl-gcc --version
          mipsel-openwrt-linux-musl-g++ --version
          mipsel-openwrt-linux-musl-strip --version

      - name: Create fake CMake modules for cross-compile
        run: |
          mkdir -p /tmp/fake_cmake_modules

          cat > /tmp/fake_cmake_modules/FindCurses.cmake << 'EOF'
          SET(CURSES_FOUND TRUE)
          SET(CURSES_LIBRARY "" CACHE STRING "" FORCE)
          SET(CURSES_LIBRARIES "" CACHE STRING "" FORCE)
          SET(CURSES_INCLUDE_PATH "/usr/include" CACHE PATH "" FORCE)
          SET(CURSES_INCLUDE_DIRS "/usr/include" CACHE PATH "" FORCE)
          SET(CURSES_CURSES_LIBRARY "" CACHE STRING "" FORCE)
          SET(CURSES_NCURSES_LIBRARY "" CACHE STRING "" FORCE)
          SET(HAVE_CURSES_H TRUE CACHE BOOL "" FORCE)
          SET(HAVE_NCURSES_H TRUE CACHE BOOL "" FORCE)
          SET(HAVE_TERM_H TRUE CACHE BOOL "" FORCE)
          message(STATUS "Fake FindCurses: skipped detection for cross-compile")
          EOF

          cat > /tmp/fake_cmake_modules/FindGnuTLS.cmake << 'EOF'
          SET(GNUTLS_FOUND TRUE)
          SET(GNUTLS_LIBRARIES "" CACHE STRING "" FORCE)
          SET(GNUTLS_LIBRARY "" CACHE STRING "" FORCE)
          SET(GNUTLS_INCLUDE_DIR "/usr/include" CACHE PATH "" FORCE)
          SET(GNUTLS_INCLUDE_DIRS "/usr/include" CACHE PATH "" FORCE)
          SET(GNUTLS_VERSION "3.7.0" CACHE STRING "" FORCE)
          message(STATUS "Fake FindGnuTLS: skipped detection for cross-compile")
          EOF

          cat > /tmp/fake_cmake_modules/FindCURL.cmake << 'EOF'
          SET(CURL_FOUND TRUE)
          SET(CURL_LIBRARIES "" CACHE STRING "" FORCE)
          SET(CURL_LIBRARY "" CACHE STRING "" FORCE)
          SET(CURL_INCLUDE_DIRS "/usr/include" CACHE PATH "" FORCE)
          SET(CURL_INCLUDE_DIR "/usr/include" CACHE PATH "" FORCE)
          SET(CURL_VERSION_STRING "7.68.0" CACHE STRING "" FORCE)
          message(STATUS "Fake FindCURL: skipped detection for cross-compile")
          EOF

          cat > /tmp/fake_cmake_modules/FindBZip2.cmake << 'EOF'
          SET(BZIP2_FOUND TRUE)
          SET(BZIP2_LIBRARIES "" CACHE STRING "" FORCE)
          SET(BZIP2_INCLUDE_DIRS "/usr/include" CACHE PATH "" FORCE)
          SET(BZIP2_INCLUDE_DIR "/usr/include" CACHE PATH "" FORCE)
          message(STATUS "Fake FindBZip2: skipped detection for cross-compile")
          EOF

          cat > /tmp/fake_cmake_modules/FindLZ4.cmake << 'EOF'
          SET(LZ4_FOUND TRUE)
          SET(LZ4_LIBRARIES "" CACHE STRING "" FORCE)
          SET(LZ4_INCLUDE_DIRS "/usr/include" CACHE PATH "" FORCE)
          SET(LZ4_VERSION "1.9.0" CACHE STRING "" FORCE)
          message(STATUS "Fake FindLZ4: skipped detection for cross-compile")
          EOF

          cat > /tmp/fake_cmake_modules/FindLibLZMA.cmake << 'EOF'
          SET(LIBLZMA_FOUND TRUE)
          SET(LIBLZMA_LIBRARIES "" CACHE STRING "" FORCE)
          SET(LIBLZMA_INCLUDE_DIRS "/usr/include" CACHE PATH "" FORCE)
          SET(LIBLZMA_INCLUDE_DIR "/usr/include" CACHE PATH "" FORCE)
          SET(LIBLZMA_HAS_AUTO_DECODER TRUE CACHE BOOL "" FORCE)
          SET(LIBLZMA_HAS_EASY_ENCODER TRUE CACHE BOOL "" FORCE)
          SET(LIBLZMA_HAS_LZMA_PRESET TRUE CACHE BOOL "" FORCE)
          message(STATUS "Fake FindLibLZMA: skipped detection for cross-compile")
          EOF

          cat > /tmp/fake_cmake_modules/FindLZO.cmake << 'EOF'
          SET(LZO_FOUND TRUE)
          SET(LZO_LIBRARIES "" CACHE STRING "" FORCE)
          SET(LZO_INCLUDE_DIRS "/usr/include" CACHE PATH "" FORCE)
          message(STATUS "Fake FindLZO: skipped detection for cross-compile")
          EOF

          cat > /tmp/fake_cmake_modules/FindSnappy.cmake << 'EOF'
          SET(SNAPPY_FOUND TRUE)
          SET(SNAPPY_LIBRARIES "" CACHE STRING "" FORCE)
          SET(SNAPPY_INCLUDE_DIRS "/usr/include" CACHE PATH "" FORCE)
          message(STATUS "Fake FindSnappy: skipped detection for cross-compile")
          EOF

      - name: Create CMake cross-compilation toolchain file (Soft-Float)
        run: |
          TOOLCHAIN_DIR=$(ls -d /opt/cross/openwrt-sdk-*/staging_dir/toolchain-*)
          TARGET_DIR=$(ls -d /opt/cross/openwrt-sdk-*/staging_dir/target-*)
          printf '%s\n' \
            'SET(CMAKE_SYSTEM_NAME Linux)' \
            'SET(CMAKE_SYSTEM_PROCESSOR mipsel)' \
            'SET(CMAKE_CROSSCOMPILING ON)' \
            '' \
            'SET(CMAKE_C_COMPILER   mipsel-openwrt-linux-musl-gcc)' \
            'SET(CMAKE_CXX_COMPILER mipsel-openwrt-linux-musl-g++)' \
            'SET(CMAKE_AR           mipsel-openwrt-linux-musl-ar      CACHE FILEPATH "Archiver")' \
            'SET(CMAKE_RANLIB       mipsel-openwrt-linux-musl-ranlib)' \
            'SET(CMAKE_STRIP        mipsel-openwrt-linux-musl-strip)' \
            'SET(CMAKE_OBJCOPY      mipsel-openwrt-linux-musl-objcopy)' \
            'SET(CMAKE_OBJDUMP      mipsel-openwrt-linux-musl-objdump)' \
            'SET(CMAKE_NM           mipsel-openwrt-linux-musl-nm)' \
            '' \
            '# 软浮点 + MIPS32r2 指令集（极路由 MT7620/MT7628）' \
            'SET(CMAKE_C_FLAGS   "-march=mips32r2 -msoft-float" CACHE STRING "" FORCE)' \
            'SET(CMAKE_CXX_FLAGS "-march=mips32r2 -msoft-float" CACHE STRING "" FORCE)' \
            '' \
            '# 静态链接放在链接器阶段，避免破坏 CMake try_compile 测试' \
            'SET(CMAKE_EXE_LINKER_FLAGS    "-static" CACHE STRING "" FORCE)' \
            'SET(CMAKE_SHARED_LINKER_FLAGS ""        CACHE STRING "" FORCE)' \
            '' \
            '# OpenWrt SDK sysroot' \
            "SET(CMAKE_SYSROOT ${TARGET_DIR})" \
            '' \
            'SET(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)' \
            'SET(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)' \
            'SET(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)' \
            'SET(CMAKE_FIND_ROOT_PATH_MODE_PACKAGE ONLY)' \
            > mipsel-sf-toolchain.cmake

      - name: Configure MariaDB for HiWiFi (Soft-Float Static)
        run: |
          mkdir -p bld_hiwifi
          cd bld_hiwifi

          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=../mipsel-sf-toolchain.cmake \
            -DCMAKE_MODULE_PATH=/tmp/fake_cmake_modules \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_CONFIG=mysql_release \
            -DFEATURE_SET=small \
            -DWITH_SSL=bundled \
            -DWITH_ZLIB=bundled \
            -DWITH_PCRE=bundled \
            -DWITH_READLINE=NO \
            -DWITH_JEMALLOC=OFF \
            -DWITH_EMBEDDED_SERVER=OFF \
            -DWITH_EXTRA_CHARSETS=all \
            -DWITH_UNIT_TESTS=OFF \
            -DWITH_TESTS=OFF \
            -DWITH_SAFEMALLOC=OFF \
            -DWITH_DBUG_TRACE=OFF \
            -DWITH_ASAN=OFF \
            -DWITH_TSAN=OFF \
            -DWITH_UBSAN=OFF \
            -DWITH_NUMA=OFF \
            -DIGNORE_AIO_CHECK=YES \
            -DENABLED_PROFILING=OFF \
            -DSECURITY_HARDENED=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DWITHOUT_SERVER=OFF \
            -DCLIENT_PLUGIN_ZSTD=OFF \
            -DWITH_ROCKSDB_BZip2=OFF \
            -DWITH_ROCKSDB_LZ4=OFF \
            -DWITH_ROCKSDB_SNAPPY=OFF \
            -DWITH_ROCKSDB_ZSTD=OFF \
            -DWITH_PAM=OFF \
            -DPLUGIN_AUTH_PAM=NO \
            -DPLUGIN_AUTH_PAM_V1=NO \
            -DWITH_CURL=OFF \
            -DHAVE_STACKTRACE=OFF \
            -DHAVE_BACKTRACE=OFF \
            -DWITH_SYSTEMD=no \
            -DWITH_LIBWRAP=OFF \
            -DWITH_WSREP=OFF \
            -DPLUGIN_ROCKSDB=NO \
            -DPLUGIN_OQGRAPH=NO \
            -DPLUGIN_SPHINX=NO \
            -DPLUGIN_MROONGA=NO \
            -DPLUGIN_CONNECT=NO \
            -DPLUGIN_HANDLERSOCKET=NO \
            -DPLUGIN_QUERY_CACHE_INFO=NO \
            -DPLUGIN_QUERY_RESPONSE_TIME=NO \
            -DPLUGIN_SERVER_AUDIT=NO \
            -DPLUGIN_SQL_ERRLOG=NO \
            -DPLUGIN_USERSTAT=NO \
            -DPLUGIN_METADATA_LOCK_INFO=NO \
            -DPLUGIN_TEST_VERSIONING=NO \
            -DPLUGIN_THREAD_POOL_INFO=NO \
            -DPLUGIN_SIMPLE_PASSWORD_CHECK=NO \
            -DPLUGIN_PASSWORD_REUSE_CHECK=NO \
            -DBISON_EXECUTABLE=/usr/bin/bison \
            -DFLEX_EXECUTABLE=/usr/bin/flex \
            -DCOMPILATION_COMMENT="HiWiFi MIPS32 Soft-Float (Built for MariaDB)" \
            2>&1 | tee cmake-config.log

      - name: Dump full CMake logs on failure
        if: failure()
        run: |
          echo "=== Full cmake-config.log ==="
          cat bld_hiwifi/cmake-config.log 2>/dev/null || true
          echo ""
          echo "=== CMakeError.log ==="
          cat bld_hiwifi/CMakeFiles/CMakeError.log 2>/dev/null || true
          echo ""
          echo "=== CMakeOutput.log (tail 80) ==="
          cat bld_hiwifi/CMakeFiles/CMakeOutput.log 2>/dev/null | tail -n 80 || true

      - name: Build MariaDB for HiWiFi
        run: |
          cd bld_hiwifi
          cmake --build . --verbose -- -j$(nproc)

      - name: Verify soft-float binaries
        run: |
          cd bld_hiwifi
          echo "=== Checking for hard-float opcodes (should be empty) ==="
          find . -type f -executable -exec mipsel-openwrt-linux-musl-objdump -d {} \; 2>/dev/null | grep -E '\badd\.s\b|\bsub\.s\b|\bmul\.s\b|\bdiv\.s\b' || echo "No hard-float instructions found - GOOD"

          echo "=== File info ==="
          find . -type f -executable -exec file {} \; | grep -i mipsel || true

      - name: Strip MIPS binaries
        run: |
          cd bld_hiwifi
          for binary in \
            sql/mysqld \
            client/mariadb \
            client/mariadb-check \
            client/mariadb-dump \
            client/mariadb-import \
            client/mariadb-show \
            client/mariadb-slap \
            client/mariadb-upgrade
          do
            if [ -f "$binary" ]; then
              echo "Stripping $binary"
              mipsel-openwrt-linux-musl-strip --strip-all "$binary"
            else
              echo "Warning: $binary not found, skipping"
            fi
          done
          echo "Strip complete"

      - name: Package HiWiFi build artifacts
        run: |
          mkdir -p hiwifi_release/bin
          mkdir -p hiwifi_release/lib
          mkdir -p hiwifi_release/share

          for binary in \
            sql/mysqld \
            client/mariadb \
            client/mariadb-check \
            client/mariadb-dump \
            client/mariadb-import \
            client/mariadb-show \
            client/mariadb-slap \
            client/mariadb-upgrade
          do
            src="bld_hiwifi/$binary"
            if [ -f "$src" ]; then
              cp "$src" hiwifi_release/bin/
            else
              echo "Warning: $src not found, skipping copy"
            fi
          done

          find hiwifi_release -type f -executable -exec file {} \; || true

          printf '%s\n' \
            'MariaDB for HiWiFi (MIPS32/mipsel Soft-Float)' \
            '=============================================' \
            '' \
            'Build Configuration:' \
            '  - Architecture: MIPS32 little-endian (mipsel)' \
            '  - Float ABI: Soft-Float (no FPU required)' \
            '  - Build Type: Release (Minimal Embedded)' \
            '  - C Library: musl (static linked)' \
            '  - SSL: Bundled OpenSSL' \
            '  - ZLIB: Bundled' \
            '  - PCRE: Bundled' \
            '  - Readline: Disabled (embedded use, saves space)' \
            '  - Embedded Server: Disabled' \
            '  - Shared Libraries: Disabled (static only)' \
            '  - PAM: Disabled' \
            '  - NUMA: Disabled' \
            '  - Profiling: Disabled' \
            '' \
            'Deployment Instructions for HiWiFi:' \
            '  1. Copy the entire hiwifi_release/ directory to your router' \
            '  2. Place binaries in /usr/bin/ or /opt/bin/' \
            '  3. All binaries are statically linked, no library dependencies' \
            '  4. Run as lightweight embedded database' \
            '' \
            'Note: This is a minimal embedded build. Not all storage engines' \
            '      and features are included. Built for MT7620/MT7628 (no FPU).' \
            > hiwifi_release/README.txt

          tar czf MariaDB_HiWiFi_MIPS32_SoftFloat.tar.gz hiwifi_release/

      - name: Upload HiWiFi build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MariaDB_HiWiFi_MIPS32_${{ matrix.suffix }}
          path: |
            MariaDB_HiWiFi_MIPS32_SoftFloat.tar.gz
            hiwifi_release/
          if-no-files-found: error

  release:
    needs: build-mips-sf
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download HiWiFi artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -la artifacts/

      - name: Create or Update HiWiFi Dev Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="dev-hiwifi"
          echo "Using fixed tag: $VERSION"

          gh release delete "$VERSION" --yes 2>/dev/null || true
          git push --delete origin "$VERSION" 2>/dev/null || true

          git tag -f "$VERSION"
          git push -f origin "$VERSION"

          NOTES=$'Automatic build from commit '"${{ github.sha }}"$'\n\n**Platform:**\n- HiWiFi MIPS32 (mipsel) Soft-Float\n- No FPU required (MT7620/MT7628 compatible)\n\n**Features:**\n- Minimal Embedded Server\n- musl libc static linking\n- Bundled SSL/Zlib/PCRE\n- Optimized for embedded devices'

          gh release create "$VERSION" \
            --title "MariaDB HiWiFi (MIPS32 Soft-Float) Development Build" \
            --notes "$NOTES" \
            --prerelease \
            artifacts/*